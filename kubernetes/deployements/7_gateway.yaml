apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: esmaeeil/gatewayserver:1.0
          env:
            - name: SPRING_APPLICATION_NAME
              valueFrom:
                configMapKeyRef:
                  name: eazybank-configmap
                  key: GATEWAY_APPLICATION_NAME
            - name: EUREKA_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: eazybank-configmap
                  key: EUREKA_SERVER_URL
          ports:
            - containerPort: 8072
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 8072
      targetPort: 8072