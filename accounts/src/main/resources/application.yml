server:
  port: 8080
spring:
  web:
    resources:
      add-mappings: false
  profiles:
    active: default
  application:
    name: accounts
  #  config:
  #    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8071/}"
  datasource:
    url: jdbc:h2:mem:accountsdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      path: /h2-console
      enabled: true
      settings:
        web-allow-others: true
        trace: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  cloud:
    config:
      enabled: false
    openfeign:
      circuitbreaker:
        enabled: true
    function:
      definition: updateCommunication

    stream:
      defaultBinder: kafka
      bindings:
        sendCommunication-out-0:
          destination: send-communication
        updateCommunication-in-0:
          destination: communication-sent
          group: ${spring.application.name}
      kafka:
        binder:
          brokers: ${KAFKA_URL:localhost:9092}
          autoCreateTopics: true
      rabbit:
        bindings:
          springCloudBusInput:
            consumer:
              anonymousGroupPrefix: "${spring.application.name}-service-${spring.profiles.active:default}-"



eureka:
  instance:
    # the default is thet the server should register itself using DNS but in local we relay on ip and port
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    # eureka server URL
    service-url:
      # must be (camelCase)
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8070/eureka/}

# enable detailed information to be shown in eureka dashboard, get fetch through actuator info end-point
info:
  app:
    name: accounts
    description: "Eazy Bank Accounts Application"
    version: "1.0.0"



management:
  endpoints:
    web:
      exposure:
        # enable all actuator end-points
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    shutdown:
      access: unrestricted
    health:
      probes:
        enabled: true
  # enable info end-point
  info:
    env:
      enabled: true


endpoints:
  shoutdown:
    enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
  ratelimiter:
    configs:
      default:
        # this prop is to till any coming request if not accepted you can wait for this duration
        timeout-duration: 1000
        # this prop is to configure the request counter, if it reached 0 then do not accept any request
        limit-for-period: 1
        # this prop is timer to reset limit-for-period prop
        limit-refresh-period:  5000


logging:
  level:
    com:
      esmaeeil:
        eazybank:
          accounts: DEBUG
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"