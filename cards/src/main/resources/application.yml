server:
  port: 9000
spring:
  web:
    resources:
      add-mappings: false
  profiles:
    active: default
  application:
    name: cards
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8071/}"
  datasource:
    url: jdbc:h2:mem:cardsdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      path: /h2-console
      enabled: true
      settings:
        web-allow-others: true
        trace: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  cloud:
    stream:
      rabbit:
        bindings:
          springCloudBusInput:
            consumer:
              anonymousGroupPrefix: "${spring.application.name}-service-${spring.profiles.active:default}-"

eureka:
  instance:
    # the default is thet the server should register itself using DNS but in local we relay on ip and port
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    # eureka server URL
    service-url:
      # must be (camelCase)
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8070/eureka/}

# enable detailed information to be shown in eureka dashboard, get fetch through actuator info end-point
info:
  app:
    name: cards
    description: "Eazy Bank Cards Application"
    version: "1.0.0"

management:
  endpoints:
    web:
      exposure:
        # enable all actuator end-points
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    shutdown:
      access: unrestricted
    health:
      probes:
        enabled: true
  # enable info end-point
  info:
    env:
      enabled: true


endpoints:
  shoutdown:
    enabled: true



logging:
  level:
    com:
      esmaeeil:
        eazybank:
          cards: DEBUG
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"