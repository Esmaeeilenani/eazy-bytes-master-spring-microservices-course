name: eazy-bytes-microservice-course-compose
services:
  #  db services
  accountsdb:
    container_name: accountsdb
    ports:
      - 3306:3306
    environment:
      MYSQL_DATABASE: accountsdb
    extends:
      file: common-config.yml
      service: microservice-db-config

  loansdb:
    container_name: loansdb
    ports:
      - 3307:3306
    environment:
      MYSQL_DATABASE: loansdb
    extends:
      file: common-config.yml
      service: microservice-db-config

  cardsdb:
    container_name: cardsdb
    ports:
      - 3308:3306
    environment:
      MYSQL_DATABASE: cardsdb
    extends:
      file: common-config.yml
      service: microservice-db-config

  #  application services
  accounts:
    image: "esmaeeil/accounts:2.0"
    container_name: accounts-ms
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health/readiness > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "accounts"
      SPRING_DATASOURCE_URL: "jdbc:mysql://accountsdb:3306/accountsdb"
      OTEL_SERVICE_NAME: "accounts"
      KAFKA_URL: kafka:9092
    depends_on:
      #      configserver:
      #        condition: service_healthy
      eurekaserver:
        condition: service_healthy
      accountsdb:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-domain-deps-config

  loans:
    image: "esmaeeil/loans:2.0"
    container_name: loans-ms
    ports:
      - "8090:8090"
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://localhost:8090/actuator/health/readiness > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "loans"
      SPRING_DATASOURCE_URL: "jdbc:mysql://loansdb:3306/loansdb"
      OTEL_SERVICE_NAME: "loans"
    depends_on:
      #      configserver:
      #        condition: service_healthy
      eurekaserver:
        condition: service_healthy
      loansdb:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-domain-deps-config


  cards:
    image: "esmaeeil/cards:2.0"
    container_name: cards-ms
    ports:
      - "9000:9000"
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://localhost:9000/actuator/health/readiness > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "cards"
      SPRING_DATASOURCE_URL: "jdbc:mysql://cardsdb:3306/cardsdb"
      OTEL_SERVICE_NAME: "cards"
    depends_on:
      #      configserver:
      #        condition: service_healthy
      eurekaserver:
        condition: service_healthy
      cardsdb:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-domain-deps-config

  message:
    image: "esmaeeil/message:2.0"
    container_name: messages-ms
    ports:
      - "9010:9010"
    environment:
      SPRING_APPLICATION_NAME: "message"
      KAFKA_URL: kafka:9092
    depends_on:
      eurekaserver:
        condition: service_healthy
      kafka:
        condition: service_started
    extends:
      file: common-config.yml
      service: microservice-domain-deps-config

  #  configserver:
  #    image: "esmaeeil/configserver:1.0"
  #    container_name: configserver-ms
  #    ports:
  #      - "8071:8071"
  #    healthcheck:
  #      test: [ "CMD-SHELL", "curl --fail --silent http://localhost:8071/actuator/health/readiness > /dev/null || exit 1" ]
  #      interval: 10s
  #      timeout: 5s
  #      retries: 10
  #      start_period: 10s
  #    environment:
  #      SPRING_APPLICATION_NAME: "configserver"
  #    depends_on:
  #      rabbit:
  #        condition: service_healthy
  #    extends:
  #      file: common-config.yml
  #      service: microservice-base-config

  eurekaserver:
    image: "esmaeeil/eurekaserver:1.0"
    container_name: eurekaserver-ms
    ports:
      - "8070:8070"
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://localhost:8070/actuator/health/readiness > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "eurekaserver"
    #    depends_on:
    #      configserver:
    #        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-configserver-config

  gatewayserver:
    image: "esmaeeil/gatewayserver:1.0"
    container_name: gatewayserver-ms
    ports:
      - "8072:8072"
    environment:
      SPRING_APPLICATION_NAME: "gatewayserver"
      SPRING_DATA_REDIS_CONNECT-TIMEOUT: 2s
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_TIMEOUT: 1s
      OTEL_SERVICE_NAME: "gatewayserver"
    depends_on:
      #      configserver:
      #        condition: service_healthy
      eurekaserver:
        condition: service_healthy
      accounts:
        condition: service_healthy
      cards:
        condition: service_healthy
      loans:
        condition: service_healthy
      redis:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-domain-deps-config



  rabbit:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    extends:
      file: common-config.yml
      service: network-deploy-service
  redis:
    image: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      timeout: 10s
      retries: 10
    extends:
      file: common-config.yml
      service: network-deploy-service

